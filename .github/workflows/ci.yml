name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check tools/validate-config.js
      - run: npm test
      - name: Validate example config
        run: node tools/validate-config.js examples/openclaw-provider.example.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python -c "import yaml;yaml.safe_load(open('examples/compose.example.yaml'))"
